openapi: 3.1.0
info:
  title: Akasha API — registre de conception
  version: 1.0.0
  description: 'Registre des routes prévues par le catalogue Akasha. Les routes sont préfixées par /api/v1. Les schémas request/response
    génériques sont provisoires : remplacer chaque GenericCommand par un schéma Pydantic strict propre à la route avant la
    production. Les champs x-* exposent acteur, autorisation, logique métier, contraintes et écran UX/CX.'
servers:
- url: https://api.example.com/api/v1
  description: Remplacer par l’URL propre à chaque environnement
tags:
- name: 4.1 Santé, version et configuration publique
  description: Routes du module 4.1 Santé, version et configuration publique
- name: 4.10 Messagerie, notifications et blocage
  description: Routes du module 4.10 Messagerie, notifications et blocage
- name: 4.11 Signalements, modération et support
  description: Routes du module 4.11 Signalements, modération et support
- name: 4.12 Administration, audit et indicateurs
  description: Routes du module 4.12 Administration, audit et indicateurs
- name: 4.13 Demandes de prestations, catalogue et propositions — V2
  description: Routes du module 4.13 Demandes de prestations, catalogue et propositions — V2
- name: 4.14 Évaluations, avis et réputation — V2
  description: Routes du module 4.14 Évaluations, avis et réputation — V2
- name: 4.15 Abonnements, visibilité premium et paiements plateforme — V2
  description: Routes du module 4.15 Abonnements, visibilité premium et paiements plateforme — V2
- name: 4.16 Contrats, commandes, paiements, remboursements et litiges — V3
  description: Routes du module 4.16 Contrats, commandes, paiements, remboursements et litiges — V3
- name: 4.17 Communauté, ressources et formation — V5+
  description: Routes du module 4.17 Communauté, ressources et formation — V5+
- name: 4.2 Authentification, compte et préférences
  description: Routes du module 4.2 Authentification, compte et préférences
- name: 4.3 Profils, expériences, compétences, preuves, portfolio et fichiers
  description: Routes du module 4.3 Profils, expériences, compétences, preuves, portfolio et fichiers
- name: 4.4 Référentiel métiers, spécialités et compétences
  description: Routes du module 4.4 Référentiel métiers, spécialités et compétences
- name: 4.5 Organisations, adhésions et invitations
  description: Routes du module 4.5 Organisations, adhésions et invitations
- name: 4.6 Opportunités, offres d’emploi et missions
  description: Routes du module 4.6 Opportunités, offres d’emploi et missions
- name: 4.7 Recherche et recommandations
  description: Routes du module 4.7 Recherche et recommandations
- name: 4.8 Candidatures et recrutement
  description: Routes du module 4.8 Candidatures et recrutement
- name: 4.9 Entretiens et calendrier
  description: Routes du module 4.9 Entretiens et calendrier
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        data: {}
        meta:
          type: object
          additionalProperties: true
      required:
      - data
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            request_id:
              type: string
              format: uuid
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
      required:
      - error
    GenericCommand:
      type: object
      additionalProperties: true
      description: Provisoire. Remplacer par le schéma strict du endpoint avant production.
paths:
  /health/live:
    get:
      operationId: get_health_live
      tags:
      - 4.1 Santé, version et configuration publique
      summary: GET /health/live
      description: 'Acteur/accès: Supervision; public minimal | Champs: Aucun | Logique et contraintes: Indique seulement
        si le processus tourne; pas de dépendances ni secrets. | Écran/UX-CX: Aucun écran utilisateur. | Réponse: 200 {status:
        ok}'
      x-authorization: Supervision; public minimal
      x-request-fields: Aucun
      x-business-logic-and-constraints: Indique seulement si le processus tourne; pas de dépendances ni secrets.
      x-screen-ux-cx: Aucun écran utilisateur.
      x-response: '200 {status: ok}'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      security: []
  /health/ready:
    get:
      operationId: get_health_ready
      tags:
      - 4.1 Santé, version et configuration publique
      summary: GET /health/ready
      description: 'Acteur/accès: Supervision/réseau interne | Champs: Aucun | Logique et contraintes: Vérifie les dépendances
        essentielles; ne révèle ni hôte, DSN ni traces. Restreindre en production si nécessaire. | Écran/UX-CX: Aucun écran
        utilisateur. | Réponse: 200 {status: ready}'
      x-authorization: Supervision/réseau interne
      x-request-fields: Aucun
      x-business-logic-and-constraints: Vérifie les dépendances essentielles; ne révèle ni hôte, DSN ni traces. Restreindre
        en production si nécessaire.
      x-screen-ux-cx: Aucun écran utilisateur.
      x-response: '200 {status: ready}'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      security:
      - BearerAuth: []
  /public/config:
    get:
      operationId: get_public_config
      tags:
      - 4.1 Santé, version et configuration publique
      summary: GET /public/config
      description: 'Acteur/accès: Public | Champs: Aucun | Logique et contraintes: Retourne uniquement les options publiques
        : langues, pays actifs, version des conditions, fonctionnalités publiquement activées. | Écran/UX-CX: Démarrage, inscription,
        filtres. Ne pas imposer de mise à jour pour un simple changement de configuration non bloquant. | Réponse: paramètres
        publics'
      x-authorization: Public
      x-request-fields: Aucun
      x-business-logic-and-constraints: 'Retourne uniquement les options publiques : langues, pays actifs, version des conditions,
        fonctionnalités publiquement activées.'
      x-screen-ux-cx: Démarrage, inscription, filtres. Ne pas imposer de mise à jour pour un simple changement de configuration
        non bloquant.
      x-response: paramètres publics
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      security: []
  /auth/register:
    post:
      operationId: post_auth_register
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/register
      description: 'Acteur/accès: Visiteur; public limité | Champs: Contact, mot de passe si activé, nom affiché, langue,
        versions/acceptation des conditions | Logique et contraintes: Normaliser contact; unicité; créer compte et défi de
        vérification dans une transaction; déclencher l’envoi via file. Anti-énumération, limite IP/contact/appareil; compte
        non actif avant vérification. | Écran/UX-CX: Inscription. Garder les valeurs valides, erreurs près des champs, dire
        que la suite est une vérification sans révéler si un contact existe déjà. | Réponse: compte PENDING_VERIFICATION'
      x-authorization: Visiteur; public limité
      x-request-fields: Contact, mot de passe si activé, nom affiché, langue, versions/acceptation des conditions
      x-business-logic-and-constraints: Normaliser contact; unicité; créer compte et défi de vérification dans une transaction;
        déclencher l’envoi via file. Anti-énumération, limite IP/contact/appareil; compte non actif avant vérification.
      x-screen-ux-cx: Inscription. Garder les valeurs valides, erreurs près des champs, dire que la suite est une vérification
        sans révéler si un contact existe déjà.
      x-response: compte PENDING_VERIFICATION
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security: []
  /auth/login:
    post:
      operationId: post_auth_login
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/login
      description: 'Acteur/accès: Visiteur; public limité | Champs: Contact + mot de passe ou preuve OTP | Logique et contraintes:
        Vérifier identifiants et état; throttling adaptatif; créer session; MFA si policy/risque. Même message si contact
        inconnu ou mot de passe erroné; compte suspendu refusé. | Écran/UX-CX: Connexion. Proposer récupération sans confirmer
        si le compte existe. | Réponse: jeton court + refresh rotatif'
      x-authorization: Visiteur; public limité
      x-request-fields: Contact + mot de passe ou preuve OTP
      x-business-logic-and-constraints: Vérifier identifiants et état; throttling adaptatif; créer session; MFA si policy/risque.
        Même message si contact inconnu ou mot de passe erroné; compte suspendu refusé.
      x-screen-ux-cx: Connexion. Proposer récupération sans confirmer si le compte existe.
      x-response: jeton court + refresh rotatif
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security: []
  /auth/refresh:
    post:
      operationId: post_auth_refresh
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/refresh
      description: 'Acteur/accès: Refresh token valide | Champs: Refresh token, ou cookie sécurisé | Logique et contraintes:
        Rotation; invalidation de l’ancien; réutilisation détectée = révocation de la famille. | Écran/UX-CX: Renouvellement
        silencieux; si échec, revenir à la connexion sans perdre brouillon local non sensible. | Réponse: nouveaux jetons'
      x-authorization: Refresh token valide
      x-request-fields: Refresh token, ou cookie sécurisé
      x-business-logic-and-constraints: Rotation; invalidation de l’ancien; réutilisation détectée = révocation de la famille.
      x-screen-ux-cx: Renouvellement silencieux; si échec, revenir à la connexion sans perdre brouillon local non sensible.
      x-response: nouveaux jetons
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security:
      - BearerAuth: []
  /auth/logout:
    post:
      operationId: post_auth_logout
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/logout
      description: 'Acteur/accès: Session courante | Champs: Session/refresh courant | Logique et contraintes: Révoque côté
        serveur, puis efface côté client; idempotent. | Écran/UX-CX: Menu profil > Déconnexion. | Réponse: 204'
      x-authorization: Session courante
      x-request-fields: Session/refresh courant
      x-business-logic-and-constraints: Révoque côté serveur, puis efface côté client; idempotent.
      x-screen-ux-cx: Menu profil > Déconnexion.
      x-response: '204'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
