      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security: []
  /auth/password-resets:
    post:
      operationId: post_auth_password_resets
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/password-resets
      description: 'Acteur/accès: Jeton reset valide | Champs: jeton, nouveau mot de passe | Logique et contraintes: Consomme
        le token une fois, met à jour le hash et révoque les sessions selon policy. | Écran/UX-CX: Définir nouveau mot de
        passe; signaler les règles avant l’envoi. | Réponse: 204'
      x-authorization: Jeton reset valide
      x-request-fields: jeton, nouveau mot de passe
      x-business-logic-and-constraints: Consomme le token une fois, met à jour le hash et révoque les sessions selon policy.
      x-screen-ux-cx: Définir nouveau mot de passe; signaler les règles avant l’envoi.
      x-response: '204'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security:
      - BearerAuth: []
  /auth/sessions:
    get:
      operationId: get_auth_sessions
      tags:
      - 4.2 Authentification, compte et préférences
