          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security:
      - BearerAuth: []
  /auth/logout-all:
    post:
      operationId: post_auth_logout_all
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/logout-all
      description: 'Acteur/accès: Compte connecté; réauth/MFA si risque | Champs: Confirmation | Logique et contraintes: Révoque
        toutes les sessions et trace l’action; ne permet pas de révoquer celles d’autrui. | Écran/UX-CX: Paramètres > Sécurité
        > Déconnecter tous les appareils. Afficher l’effet. | Réponse: 204'
      x-authorization: Compte connecté; réauth/MFA si risque
      x-request-fields: Confirmation
      x-business-logic-and-constraints: Révoque toutes les sessions et trace l’action; ne permet pas de révoquer celles d’autrui.
      x-screen-ux-cx: Paramètres > Sécurité > Déconnecter tous les appareils. Afficher l’effet.
      x-response: '204'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security:
      - BearerAuth: []
  /auth/verification-challenges:
    post:
      operationId: post_auth_verification_challenges
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/verification-challenges
      description: 'Acteur/accès: Public limité | Champs: Contact, canal, contexte | Logique et contraintes: Génère un OTP
        court, hashé, usage unique; applique limites d’essais/renvois et réponses uniformes. | Écran/UX-CX: Vérification de
        contact; compte à rebours et renvoi activable après délai. | Réponse: challenge_id, retry_after'
      x-authorization: Public limité
      x-request-fields: Contact, canal, contexte
      x-business-logic-and-constraints: Génère un OTP court, hashé, usage unique; applique limites d’essais/renvois et réponses
        uniformes.
      x-screen-ux-cx: Vérification de contact; compte à rebours et renvoi activable après délai.
      x-response: challenge_id, retry_after
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security: []
  /auth/verification-challenges/confirm:
    post:
      operationId: post_auth_verification_challenges_confirm
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/verification-challenges/confirm
      description: 'Acteur/accès: Possesseur du défi | Champs: challenge_id, code | Logique et contraintes: Vérifie hash,
        expiration, tentatives et contact; consomme atomiquement; active selon préconditions. | Écran/UX-CX: Écran Code. En
        cas d’expiration, offrir un nouveau code; ne pas effacer le formulaire entier. | Réponse: contact vérifié/compte activé'
      x-authorization: Possesseur du défi
      x-request-fields: challenge_id, code
      x-business-logic-and-constraints: Vérifie hash, expiration, tentatives et contact; consomme atomiquement; active selon
        préconditions.
      x-screen-ux-cx: Écran Code. En cas d’expiration, offrir un nouveau code; ne pas effacer le formulaire entier.
      x-response: contact vérifié/compte activé
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de requêtes dépassée
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericCommand'
      security:
      - BearerAuth: []
  /auth/password-reset-requests:
    post:
      operationId: post_auth_password_reset_requests
      tags:
      - 4.2 Authentification, compte et préférences
      summary: POST /auth/password-reset-requests
      description: 'Acteur/accès: Public limité | Champs: Email/téléphone | Logique et contraintes: Crée lien/code si applicable,
        mais réponse identique si le compte n’existe pas; token hashé et limité. | Écran/UX-CX: Mot de passe oublié. Message
        neutre, pas d’énumération. | Réponse: message générique'
      x-authorization: Public limité
      x-request-fields: Email/téléphone
      x-business-logic-and-constraints: Crée lien/code si applicable, mais réponse identique si le compte n’existe pas; token
        hashé et limité.
      x-screen-ux-cx: Mot de passe oublié. Message neutre, pas d’énumération.
      x-response: message générique
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: Requête mal formée
        '401':
          description: Authentification manquante ou invalide
        '403':
          description: Permission insuffisante
        '404':
          description: Ressource absente ou volontairement masquée
        '409':
          description: Conflit métier ou de concurrence
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
